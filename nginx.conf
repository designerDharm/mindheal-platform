# HTTP Server: Port 80
# Handles ACME challenge certificate verification and health probes without redirect loops,
# then permanently redirects all other traffic to HTTPS.
server {
    listen 80;
    server_name mindheal.in www.mindheal.in mindheal-platform.onrender.com localhost;

    # ACME challenge verification for Let's Encrypt / Certbot SSL certificate issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Load-balancer health check probe exemption (avoids 301 loop on HTTP probes)
    location /health {
        proxy_pass https://mindheal-platform.onrender.com/health;
        proxy_http_version 1.1;
        proxy_set_header Host mindheal-platform.onrender.com;
    }

    location /readiness {
        proxy_pass https://mindheal-platform.onrender.com/readiness;
        proxy_http_version 1.1;
        proxy_set_header Host mindheal-platform.onrender.com;
    }

    # Enforce HTTPS: Redirect all general HTTP traffic to canonical HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: Port 443
# Enforces modern TLS protocols, robust ciphers, HSTS with preload, and reverse proxying
server {
    listen 443 ssl http2;
    server_name mindheal.in www.mindheal.in mindheal-platform.onrender.com;
    root /usr/share/nginx/html;
    index index.html;

    # SSL Certificate Configuration
    ssl_certificate /etc/ssl/certs/mindheal.crt;
    ssl_certificate_key /etc/ssl/private/mindheal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Comprehensive HTTPS Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; connect-src 'self' https: wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; upgrade-insecure-requests;" always;

    # Reverse proxy for API routes: forward to backend origin and preserve JSON status codes
    location /api/ {
        proxy_pass https://mindheal-platform.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header Host mindheal-platform.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors off;
    }

    # Health check forwarder
    location /health {
        proxy_pass https://mindheal-platform.onrender.com/health;
        proxy_http_version 1.1;
        proxy_set_header Host mindheal-platform.onrender.com;
    }

    location /readiness {
        proxy_pass https://mindheal-platform.onrender.com/readiness;
        proxy_http_version 1.1;
        proxy_set_header Host mindheal-platform.onrender.com;
    }

    # SPA routing - fallback to index.html strictly for non-API web pages
    location / {
        try_files $uri $uri/ /index.html;
    }
}

