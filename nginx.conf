server {
    listen 80;
    server_name localhost mindheal.in www.mindheal.in;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reverse proxy for API routes: forward to backend origin and preserve JSON status codes
    location /api/ {
        proxy_pass https://mindheal-platform.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header Host mindheal-platform.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    # Health check forwarder
    location /health {
        proxy_pass https://mindheal-platform.onrender.com/health;
        proxy_http_version 1.1;
        proxy_set_header Host mindheal-platform.onrender.com;
    }

    # SPA routing - fallback to index.html strictly for non-API web pages
    location / {
        try_files $uri $uri/ /index.html;
    }
}
